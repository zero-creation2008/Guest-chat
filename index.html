<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero - Login</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background:#0b141a;
    color:white;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:sans-serif;
}
.auth-card {
    width:100%;
    max-width:400px;
    padding:2rem;
    background:#111b21;
    border-radius:1.5rem;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    border:1px solid #222;
    animation:fadeIn .5s ease;
}
@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
input {
    width:100%;
    background:#2a3942;
    border:1px solid #333;
    padding:.85rem;
    border-radius:.75rem;
    margin-bottom:1rem;
    color:white;
    outline:none;
}
input:focus {
    border-color:#00a884;
    background:#32444f;
}
.btn-primary {
    width:100%;
    background:#00a884;
    padding:.85rem;
    border-radius:.75rem;
    font-weight:bold;
    margin-bottom:.75rem;
}
</style>
</head>

<body>

<div class="auth-card">
    <h1 class="text-4xl text-center text-[#00a884] font-black mb-4">ZERO</h1>

    <p id="msg" class="text-red-400 text-sm mb-2 text-center"></p>

    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">

    <button id="btnLogin" class="btn-primary">Login</button>
    <button id="btnSignup" class="w-full text-emerald-400 text-sm mb-4">Create Account</button>

    <button id="btnGoogle" class="w-full bg-white text-black py-3 rounded-xl font-bold">
        Google Sign In
    </button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔐 BASIC OBFUSCATION (NOT REAL SECURITY) */
const k1 = "AIzaSy";
const k2 = "C4mYZ5G";
const k3 = "-WCjt7wAN0G6_B6";
const k4 = "rh1LDM10U0Q";

const firebaseConfig = {
    apiKey: k1 + k2 + k3 + k4,
    authDomain: "chat-data-59467.firebaseapp.com",
    projectId: "chat-data-59467",
    storageBucket: "chat-data-59467.appspot.com",
    messagingSenderId: "237808362163",
    appId: "1:237808362163:web:52d25dfbffaffde12446c6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* Elements */
const email = document.getElementById("email");
const pass = document.getElementById("pass");
const msg = document.getElementById("msg");
const btnLogin = document.getElementById("btnLogin");
const btnSignup = document.getElementById("btnSignup");

/* Auto redirect */
onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "chat.html";
});

/* Validation */
function validate() {
    if (!email.value || !pass.value) {
        msg.innerText = "Enter email & password";
        return false;
    }
    if (pass.value.length < 6) {
        msg.innerText = "Password must be 6+ characters";
        return false;
    }
    msg.innerText = "";
    return true;
}

/* Login */
btnLogin.onclick = async () => {
    if (!validate()) return;

    btnLogin.innerText = "Loading...";
    try {
        await signInWithEmailAndPassword(auth, email.value, pass.value);
    } catch (e) {
        msg.innerText = e.message;
    }
    btnLogin.innerText = "Login";
};

/* Signup */
btnSignup.onclick = async () => {
    if (!validate()) return;

    btnSignup.innerText = "Creating...";
    try {
        await createUserWithEmailAndPassword(auth, email.value, pass.value);
        msg.innerText = "Account created!";
    } catch (e) {
        msg.innerText = e.message;
    }
    btnSignup.innerText = "Create Account";
};

/* Google */
document.getElementById("btnGoogle").onclick = async () => {
    try {
        await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (e) {
        msg.innerText = e.message;
    }
};

</script>

</body>
</html>
